# The app container only. The database is a HOSTED PostgreSQL that you point DATABASE_URL at (Neon, Supabase, Render, RDS, ...).
#   cp .env.example .env   (fill in DATABASE_URL, SECRET_KEY, PUBLIC_BASE_URL, Stripe keys)
#   docker compose up -d --build      -> http://localhost:8000
# To try everything against a throw-away PostgreSQL on this machine instead (development only):
#   docker compose --profile localdb up -d --build   with DATABASE_URL=postgresql+psycopg://legacyfc:<POSTGRES_PASSWORD>@db:5432/legacyfc
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (hosted PostgreSQL)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports: ["${PORT:-8000}:8000"]
    depends_on:  # only with --profile localdb; ignored when the database is hosted
      db: { condition: service_healthy, required: false }
  db:
    profiles: ["localdb"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: legacyfc
      POSTGRES_USER: legacyfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacyfc -d legacyfc"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
